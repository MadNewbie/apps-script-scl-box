<!DOCTYPE html>
<html lang="en">
  <head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <base target="_top">
    <style>
      /* Base button styles */
      .loading-btn {
        position: relative;
        padding: 12px 24px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .loading-btn:disabled {
        background-color: #a0cfff;
        cursor: not-allowed;
      }

      /* Spinner hidden by default */
      .loading-btn::after {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        margin: auto;
        border: 4px solid transparent;
        border-top-color: #ffffff;
        border-radius: 50%;
        opacity: 0;
        transition: opacity 0.2s;
      }

      /* Loading state styles */
      .loading-btn.loading .btn-text {
        visibility: hidden; /* Hides text but keeps button size */
        opacity: 0;
      }

      .loading-btn.loading::after {
        opacity: 1;
        animation: button-loading-spinner 1s ease infinite;
      }

      /* Rotation animation */
      @keyframes button-loading-spinner {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <form class="container" id="formCetakLaporanKpsBelumDiterima">
      <div id="message"></div>
      <div class="row">
        <div class="col-md-6 col-sm-12">
          <div class="row">
            <div class="col-12">
              <label for="periode" class="form-label">Periode: </label>
              <select name="periode" id="periode" class="form-control">
                <option value="">--Pilih Periode--</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <div class="row my-4">
        <div class="col-12 text-end">
          <button type="submit" class="btn btn-md btn-primary loading-btn" id="btnSubmitCetakLaporanKpsBelumDiterima"><span class="btn-text">Siapkan Data</span></button>
        </div>
      </div>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>

      function populatePeriodeDropdown() {
        var el = document.getElementById('periode')
        var yearNow = new Date().getFullYear()
        for(var i = 2024; i<=yearNow; i++) {
          var option = document.createElement('option')
          option.value = i
          option.textContent = i
          el.appendChild(option)
        }
      }
      
      function showError(error) {
        window.alert(error)
      }

      document.addEventListener('DOMContentLoaded',function(){
        populatePeriodeDropdown()
      })

      document.getElementById('formCetakLaporanKpsBelumDiterima').addEventListener('submit', function (e) {
        e.preventDefault()
        var formData = Object.fromEntries(new FormData(e.target).entries())

        if(!formData.periode) {
          window.alert("Silahkan pilih periode dahulu!")
          return
        }

        document.getElementById('btnSubmitCetakLaporanKpsBelumDiterima').classList.add('loading')
        document.getElementById('btnSubmitCetakLaporanKpsBelumDiterima').disabled = true

        google.script.run
          .withFailureHandler((error)=>showError(error))
          .withSuccessHandler(function (res) {
            document.getElementById('btnSubmitCetakLaporanKpsBelumDiterima').disabled = false
            document.getElementById('btnSubmitCetakLaporanKpsBelumDiterima').classList.remove('loading')
            window.alert(res)
          })
          .printReportKpsNotReceive(formData)

      })

    </script>
  </body>
</html>
