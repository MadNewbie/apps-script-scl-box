<!DOCTYPE html>
<html lang="en">
  <head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <base target="_top">
  </head>
  <body>
    <form id="formPengembalianKotak" class="container">
      <div id="message"></div>
      <div class="row">
        <div class="col-md-6 col-sm-12">
          <div class="row">
            <div class="col-12">
              <label for="gudangTujuan" class="form-label">Gudang Tujuan Pengembalian: </label>
              <select name="gudangTujuan" id="gudangTujuan" class="form-control">
                <option value="">--Pilih Gudang Tujuan--</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <div class="row my-2">
        <div class="col-md-12">
          <div class="row">
            <div class="col-12">
              <label for="dataKotak" class="form-label">Data kotak dipinjam yang belum dikembalikan</label>
              <select name="dataKotak" id="dataKotak" class="form-control" multiple>
              </select>
            </div>
          </div>
        </div>
      </div>
      <div class="row my-4">
        <div class="col-12 text-end">
          <button type="submit" class="btn btn-md btn-primary">Simpan</button>
        </div>
      </div>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
      google.script.run
        .withSuccessHandler(populateGudangDropdown)
        .withFailureHandler(showError)
        .getDropdownGudangData()

      google.script.run
        .withSuccessHandler(populateDataKotak)
        .withFailureHandler(showError)
        .getAvailReturnKotak()

      function populateGudangDropdown(data) {
        var el = document.getElementById('gudangTujuan')
        data.forEach(function(item) {
          var option = document.createElement('option')
          option.value = item
          option.textContent = item
          el.appendChild(option)
        })
      }
    
      function showError(error) {
        window.alert(error)
      }

      function populateDataKotak(data) {
        var elDataKotak = document.getElementById('dataKotak')
        elDataKotak.textContent = ''
        data.forEach(function(kotak) {
          var elOption = document.createElement('option')
          elOption.value = kotak[0]
          elOption.text = `${kotak[1]}`
          elDataKotak.appendChild(elOption)
        })
      }

      document.getElementById('formPengembalianKotak').addEventListener('submit', function(e) {
        e.preventDefault()
        formData = Object.fromEntries(new FormData(e.target).entries())
        
        var gudangTujuan = document.getElementById('gudangTujuan').value
        var dataKotakSelected = []

        if (gudangTujuan==='') {
          window.alert('Gudang tujuan harus diisi')
          return
        }

        for(var i=0; i<document.getElementById('dataKotak').options.length; i++){
          if(document.getElementById('dataKotak').options[i].selected){
            dataKotakSelected.push(document.getElementById('dataKotak').options[i].value)
          }
        }

        google.script.run
          .withSuccessHandler(function (message) {
            window.alert(message)
            document.getElementById('formPengembalianKotak').reset()
            document.getElementById('dataKotak').textContent = ''
          })
          .withFailureHandler(function (error) {
            window.alert(error)
          })
          .saveDataPengembalianKotak(dataKotakSelected, gudangTujuan)
      })
      
    </script>
  </body>
</html>
