<!DOCTYPE html>
<html lang="en">
  <head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <base target="_top">
    <style>
      /* Base button styles */
      .loading-btn {
        position: relative;
        padding: 12px 24px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .loading-btn:disabled {
        background-color: #a0cfff;
        cursor: not-allowed;
      }

      /* Spinner hidden by default */
      .loading-btn::after {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        margin: auto;
        border: 4px solid transparent;
        border-top-color: #ffffff;
        border-radius: 50%;
        opacity: 0;
        transition: opacity 0.2s;
      }

      /* Loading state styles */
      .loading-btn.loading .btn-text {
        visibility: hidden; /* Hides text but keeps button size */
        opacity: 0;
      }

      .loading-btn.loading::after {
        opacity: 1;
        animation: button-loading-spinner 1s ease infinite;
      }

      /* Rotation animation */
      @keyframes button-loading-spinner {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <form class="container" id="formCetakLabel">
      <div id="message"></div>
      <div class="row">
        <div class="col-md-6 col-sm-12">
          <div class="row">
            <div class="col-12">
              <label for="gudang" class="form-label">Gudang: </label>
              <select name="gudang" id="gudang" class="form-control">
                <option value="">--Pilih Gudang--</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <label for="labelKotakAwal" class="form-label">Label Kotak Awal: </label>
              <select name="labelKotakAwal" id="labelKotakAwal" class="form-control">
                <option value="">--Pilih Label Kotak Acuan Awal--</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <label for="labelKotakAkhir" class="form-label">Label Kotak Akhir: </label>
              <select name="labelKotakAkhir" id="labelKotakAkhir" class="form-control">
                <option value="">--Pilih Label Kotak Acuan Akhir--</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <div class="row my-4">
        <div class="col-12 text-end">
          <button type="submit" class="btn btn-md btn-primary loading-btn" id="btnSubmitCetakLabel"><span class="btn-text">Siapkan Data</span></button>
        </div>
      </div>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
      google.script.run
        .withSuccessHandler(populateGudangDropdown)
        .withFailureHandler(showError)
        .getDropdownGudangData()

      function populateGudangDropdown(data) {
        var el = document.getElementById('gudang')
        data.forEach(function(item) {
          var option = document.createElement('option')
          option.value = item
          option.textContent = item
          el.appendChild(option)
        })
      }
      
      function showError(error) {
        window.alert(error)
      }

      function listenerGudang() {
        const gudang = document.getElementById('gudang').value

        if (gudang!='') {
          google.script.run
            .withSuccessHandler(populateLabelKotakAcuan)
            .withFailureHandler(showError)
            .getAvailDataCetakKotak(gudang)
        }
      }

      function populateLabelKotakAcuan(data) {
        var elLabelKotakAwal = document.getElementById('labelKotakAwal')
        var elLabelKotakAkhir = document.getElementById('labelKotakAkhir')
        elLabelKotakAwal.textContent = ''
        elLabelKotakAkhir.textContent = ''
        var defOptAwal = document.createElement('option')
        defOptAwal.value = ''
        defOptAwal.textContent = '--Pilih Label Kotak Acuan Awal--'
        elLabelKotakAwal.appendChild(defOptAwal)
        var defOptAkhir = document.createElement('option')
        defOptAkhir.value = ''
        defOptAkhir.textContent = '--Pilih Label Kotak Acuan Awal--'
        elLabelKotakAkhir.appendChild(defOptAkhir)
        const sorted = data.sort()
        sorted.forEach(function(kotak) {
          var elOption = document.createElement('option')
          elOption.value = kotak[4]
          elOption.text = `${kotak[4]} - ${kotak[5]} (${kotak[6]})`
          elLabelKotakAwal.appendChild(elOption.cloneNode(true))
          elLabelKotakAkhir.appendChild(elOption.cloneNode(true))
        })
      }

      function populateDataKotak(data) {
        var elDataKotak = document.getElementById('dataKotak')
        elDataKotak.textContent = ''
        const sorted = data.sort()
        sorted.forEach(function(kotak) {
          var elOption = document.createElement('option')
          elOption.value = kotak[0]
          elOption.text = `${kotak[4]} - ${kotak[5]} (${kotak[6]})`
          elDataKotak.appendChild(elOption)
        })
      }

      document.getElementById('gudang').addEventListener('change', listenerGudang)

      document.getElementById('formCetakLabel').addEventListener('submit', function (e) {
        e.preventDefault()
        var dataKotakSelected = []

        // for(var i=0; i<document.getElementById('dataKotak').options.length; i++){
        //   if(document.getElementById('dataKotak').options[i].selected){
        //     dataKotakSelected.push(document.getElementById('dataKotak').options[i].value)
        //   }
        // }

        const labelAwal = document.getElementById('labelKotakAwal').value
        var [awalBoxType, awalDocType, awalYear, awalNo] = labelAwal.split('/')
        const labelAkhir = document.getElementById('labelKotakAkhir').value
        var [akhirBoxType, akhirDocType, akhirYear, akhirNo] = labelAkhir.split('/')

        if (awalBoxType!==akhirBoxType) {
          window.alert('Tipe kotak tidak sama')
          return
        }

        if (awalDocType!==akhirDocType) {
          window.alert('Tipe dokumen tidak sama')
          return
        }

        if (awalYear!==akhirYear) {
          window.alert('Harus berada dalam satu tahun')
          return
        }

        document.getElementById('btnSubmitCetakLabel').classList.add('loading')
        document.getElementById('btnSubmitCetakLabel').disabled = true

        google.script.run
          .withFailureHandler((error)=>showError(error))
          .withSuccessHandler(function (res) {
            document.getElementById('btnSubmitCetakLabel').disabled = false
            document.getElementById('btnSubmitCetakLabel').classList.remove('loading')
            window.alert(res)
          })
          .printLabelBoxRange(labelAwal, labelAkhir)

        // google.script.run
        //   .withSuccessHandler(function(result) {
        //     const downloadLink = document.createElement('a')
        //     downloadLink.href = result.downloadUrl
        //     downloadLink.target = '_blank'
        //     downloadLink.click()

        //     google.script.host.close()
        //   })
        //   .generateAndCleanupExcel('Template Label Kotak SCL')

      })
    </script>
  </body>
</html>
