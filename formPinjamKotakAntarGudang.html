<!DOCTYPE html>
<html>
  <head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <base target="_top">
  </head>
  <body>
    <form id="formPinjamKotak" class="container">
      <div id="message"></div>
      <div class="row">
        <div class="col-md-6 col-sm-12">
          <div class="row">
            <div class="col-12">
              <label for="gudangAsal" class="form-label">Gudang Asal: </label>
              <select name="gudangAsal" id="gudangAsal" class="form-control">
                <option value="">--Pilih Gudang Asal--</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <label for="gudangTujuan" class="form-label">Gudang Tujuan: </label>
              <select name="gudangTujuan" id="gudangTujuan" class="form-control">
                <option value="">--Pilih Gudang Tujuan--</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <label for="jenisDokumen" class="form-label">Jenis Dokumen: </label>
              <select name="jenisDokuemn" id="jenisDokumen" class="form-control">
                <option value="">--Pilih Jenis Dokumen--</option>
              </select>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-sm-12">
          <div class="row">
            <div class="col-12">
              <label for="jenisDokumen" class="form-label">Tujuan Peminjaman: </label>
              <input name="tujuanPeminjaman" id="tujuanPeminjaman" type="text" class="form-control" />
            </div>
          </div>
        </div>
      </div>
      <div class="row my-2">
        <div class="col-md-12">
          <div class="row">
            <div class="col-12">
              <label for="dataKotak" class="form-label">Data kotak yang tersedia untuk dipinjam</label>
              <select name="dataKotak" id="dataKotak" class="form-control" multiple>
              </select>
            </div>
          </div>
        </div>
      </div>
      <div class="row my-4">
        <div class="col-12 text-end">
          <button type="submit" class="btn btn-md btn-primary">Simpan</button>
        </div>
      </div>
    </form>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
      google.script.run
        .withSuccessHandler(populateJenisDokumenDropdown)
        .withFailureHandler(showError)
        .getDropdownJenisDokumenData()

      google.script.run
        .withSuccessHandler(populateGudangDropdown)
        .withFailureHandler(showError)
        .getDropdownGudangData()

      function populateJenisDokumenDropdown(data) {
        var el = document.getElementById('jenisDokumen')
        data.forEach(function(item) {
          var option = document.createElement('option')
          option.value = item
          option.textContent = item
          el.appendChild(option)
        })
      }

      function populateGudangDropdown(data) {
        var elGudangAsal = document.getElementById('gudangAsal')
        var elGudangTujuan = document.getElementById('gudangTujuan')
        data.forEach(function(item) {
          var option = document.createElement('option')
          option.value = item
          option.textContent = item
          elGudangAsal.appendChild(option.cloneNode(true))
          elGudangTujuan.appendChild(option.cloneNode(true))
        })
      }
    
      function showError(error) {
        window.alert(error)
      }
      
      function listenerGudangAndJenisDokumen() {
        const jenisDokumen = document.getElementById('jenisDokumen').value
        const gudangAsal = document.getElementById('gudangAsal').value
        const gudangTujuan = document.getElementById('gudangTujuan').value

        if (jenisDokumen!='' && gudangAsal!='') {
          google.script.run
            .withSuccessHandler(populateDataKotak)
            .withFailureHandler(showError)
            .getAvailDataKotak(jenisDokumen, gudangAsal)
        }
      }

      function populateDataKotak(data) {
        var elDataKotak = document.getElementById('dataKotak')
        elDataKotak.textContent = ''
        const sorted = data.sort((a,b) => a[0].localeCompare(b[0]))
        sorted.forEach(function(kotak) {
          var elOption = document.createElement('option')
          elOption.value = kotak[0]
          elOption.text = `${kotak[4]} - ${kotak[5]} (${kotak[6]})`
          elDataKotak.appendChild(elOption)
        })
      }

      document.getElementById('gudangAsal').addEventListener('change', listenerGudangAndJenisDokumen)
      document.getElementById('gudangTujuan').addEventListener('change', listenerGudangAndJenisDokumen)
      document.getElementById('jenisDokumen').addEventListener('change', listenerGudangAndJenisDokumen)

      document.getElementById('formPinjamKotak').addEventListener('submit', function(e) {
        e.preventDefault()
        formData = Object.fromEntries(new FormData(e.target).entries())
        
        var gudangTujuan = document.getElementById('gudangTujuan').value
        var tujuanPeminjaman = document.getElementById('tujuanPeminjaman').value
        var dataKotakSelected = []

        if (tujuanPeminjaman==='') {
          window.alert('Tujuan peminjaman harus diisi')
          return
        }

        for(var i=0; i<document.getElementById('dataKotak').options.length; i++){
          if(document.getElementById('dataKotak').options[i].selected){
            dataKotakSelected.push(document.getElementById('dataKotak').options[i].value)
          }
        }

        google.script.run
          .withSuccessHandler(function (message) {
            window.alert(message)
            document.getElementById('formPinjamKotak').reset()
            document.getElementById('dataKotak').textContent = ''
          })
          .withFailureHandler(function (error) {
            window.alert(error)
          })
          .saveDataPinjamKotakAntarGudang(dataKotakSelected, tujuanPeminjaman, gudangTujuan)
      })
      
    </script>
  </body>
</html>
