<!DOCTYPE html>
<html lang="en">
  <head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <base target="_top">
    <style>
      /* Base button styles */
      .loading-btn {
        position: relative;
        padding: 12px 24px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .loading-btn:disabled {
        background-color: #a0cfff;
        cursor: not-allowed;
      }

      /* Spinner hidden by default */
      .loading-btn::after {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        margin: auto;
        border: 4px solid transparent;
        border-top-color: #ffffff;
        border-radius: 50%;
        opacity: 0;
        transition: opacity 0.2s;
      }

      /* Loading state styles */
      .loading-btn.loading .btn-text {
        visibility: hidden; /* Hides text but keeps button size */
        opacity: 0;
      }

      .loading-btn.loading::after {
        opacity: 1;
        animation: button-loading-spinner 1s ease infinite;
      }

      /* Rotation animation */
      @keyframes button-loading-spinner {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <form id="formKotakBaruHilang" class="container">
      <div id="message"></div>
      <div class="row">
        <div class="col-md-6 col-sm-12">
          <div class="row">
            <div class="col-12">
              <label for="jenisKotak" class="form-label">Jenis Kotak: </label>
              <select name="jenisKotak" id="jenisKotak" class="form-control">
                <option value="">--Pilih Jenis Kotak--</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <label for="gudang" class="form-label">Gudang: </label>
              <select name="gudang" id="gudang" class="form-control">
                <option value="">--Pilih Gudang--</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <label for="jumlahKotak" class="form-label">Jumlah Kotak: </label>
              <input type="text" name="jumlahKotak" id="jumlahKotak" class="form-control" />
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <label for="kronologi" class="form-label">Kronologi Singkat: </label>
              <input type="text" name="kronologi" id="kronologi" class="form-control" />
            </div>
          </div>
        </div>
        <div class="row my-4">
          <div class="col-12 text-end">
            <button type="submit" class="btn btn-md btn-primary loading-btn" id="btnSubmit">Simpan</button>
          </div>
        </div>
      </div>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script>
      google.script.run
        .withSuccessHandler(populateGudangDropdown)
        .withFailureHandler(showError)
        .getDropdownGudangData()

      google.script.run
        .withSuccessHandler(populateJenisKotakDropdown)
        .withFailureHandler(showError)
        .getDropdownJenisKotakData()

      function populateGudangDropdown(data) {
        var el = document.getElementById('gudang')
        data.forEach(function(item) {
          var option = document.createElement('option')
          option.value = item
          option.textContent = item
          el.appendChild(option)
        })
      }

      function populateJenisKotakDropdown(data) {
        var el = document.getElementById('jenisKotak')
        data.forEach(function(item) {
          var option = document.createElement('option')
          option.value = item
          option.textContent = item
          el.appendChild(option)
        })
      }
    
      function showError(error) {
        window.alert(error)
      }

      document.getElementById('formKotakBaruHilang').addEventListener('submit', function(e) {
        e.preventDefault()
        formData = Object.fromEntries(new FormData(e.target).entries())

        if (!formData.jenisKotak) {
          window.alert("Silahkan pilih jenis kotak dahulu!")
          return
        }

        if (!formData.gudang) {
          window.alert("Silahkan pilih gudang dahulu!")
          return
        }

        if (formData.jumlahKotak <= 0) {
          window.alert("Jumlah kotak harus lebih besar atau sama dengan 0!")
          return
        }

        if (!formData.kronologi) {
          window.alert("Kronologi singkat harus diisi!")
          return
        }

        document.getElementById('btnSubmit').classList.add('loading')
        document.getElementById('btnSubmit').disabled = true

        google.script.run
          .withFailureHandler((error) => {
            window.alert(error)
          })
          .withSuccessHandler((message) => {
            window.alert(message)
            document.getElementById('btnSubmit').classList.remove('loading')
            document.getElementById('btnSubmit').disabled = false
            document.getElementById('formKotakBaruHilang').reset()
          })
          .saveDataKotakBaruHilang(formData)
      })
    </script>
  </body>
</html>
