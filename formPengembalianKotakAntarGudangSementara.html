<!DOCTYPE html>
<html lang="en">
  <head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <base target="_top">
    <style>
      /* Base button styles */
      .loading-btn {
        position: relative;
        padding: 12px 24px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .loading-btn:disabled {
        background-color: #a0cfff;
        cursor: not-allowed;
      }

      /* Spinner hidden by default */
      .loading-btn::after {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        margin: auto;
        border: 4px solid transparent;
        border-top-color: #ffffff;
        border-radius: 50%;
        opacity: 0;
        transition: opacity 0.2s;
      }

      /* Loading state styles */
      .loading-btn.loading .btn-text {
        visibility: hidden; /* Hides text but keeps button size */
        opacity: 0;
      }

      .loading-btn.loading::after {
        opacity: 1;
        animation: button-loading-spinner 1s ease infinite;
      }

      /* Rotation animation */
      @keyframes button-loading-spinner {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <form id="formPengembalianKotakSementara" class="container">
      <div id="message"></div>
      <div class="row">
        <div class="col-md-6 col-sm-12">
          <div class="row">
            <div class="col-12">
              <label for="gudangAsal" class="form-label">Gudang Asal: </label>
              <select name="gudangAsal" id="gudangAsal" class="form-control">
                <option value="">--Pilih Gudang Asal--</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <label for="gudangTujuan" class="form-label">Gudang Tujuan: </label>
              <select name="gudangTujuan" id="gudangTujuan" class="form-control">
                <option value="">--Pilih Gudang Tujuan--</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <div class="row my-2">
        <div class="col-md-12">
          <div class="row">
            <div class="col-12">
              <label for="dataKotak" class="form-label">Data kotak yang dipinjam</label>
              <select name="dataKotak" id="dataKotak" class="form-control" multiple size="16">
              </select>
            </div>
          </div>
        </div>
      </div>
      <div class="row my-4">
        <div class="col-12 text-end">
          <button type="submit" class="btn btn-md btn-primary loading-btn" id="btnSubmit">Simpan</button>
        </div>
      </div>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script>
      google.script.run
        .withSuccessHandler(populateGudangDropdown)
        .withFailureHandler(showError)
        .getDropdownGudangData()

      function populateGudangDropdown(data) {
        var elGudangAsal = document.getElementById('gudangAsal')
        var elGudangTujuan = document.getElementById('gudangTujuan')
        data.forEach(function(item) {
          var option = document.createElement('option')
          option.value = item
          option.textContent = item
          elGudangAsal.appendChild(option.cloneNode(true))
          elGudangTujuan.appendChild(option.cloneNode(true))
        })
      }

      function showError(error) {
        window.alert(error)
      }

      function listenerGudang() {
        const gudangAsal = document.getElementById('gudangAsal').value
        const gudangTujuan = document.getElementById('gudangTujuan').value

        if(gudangAsal === gudangTujuan) {
          window.alert("Gudang tujuan tidak boleh sama dengan gudang asal")
          return
        }

        if (gudangAsal!='' && gudangTujuan!='') {
          google.script.run
            .withSuccessHandler(populateDataKotak)
            .withFailureHandler(showError)
            .getAvailDataKotakForPengembalianSementara(gudangAsal)
        }
      }

      function populateDataKotak(data) {
        var elDataKotak = document.getElementById('dataKotak')
        elDataKotak.textContent = ''
        const sorted = data.sort((a,b) => {
          const valA = a[4]
          const valB = b[4]

          const[aTypeBox, aTypeDoc, aYear, aNo] = valA.split('/')
          const[bTypeBox, bTypeDoc, bYear, bNo] = valB.split('/')

          const compTypeBox = aTypeBox.localeCompare(bTypeBox)
          const compTypeDoc = aTypeDoc.localeCompare(bTypeDoc)

          if (compTypeBox!==0){
            return compTypeBox
          }

          if (compTypeDoc!==0) {
            return compTypeDoc
          }

          if (aYear - bYear !== 0) {
            return aYear - bYear
          }

          return parseInt(aNo) - parseInt(bNo)
        })
        sorted.forEach(function(kotak) {
          var elOption = document.createElement('option')
          elOption.value = kotak[0]
          elOption.text = `${kotak[1]}`
          elDataKotak.appendChild(elOption)
        })
      }

      document.getElementById('gudangAsal').addEventListener('change',listenerGudang)
      document.getElementById('gudangTujuan').addEventListener('change',listenerGudang)

      document.getElementById('formPengembalianKotakSementara').addEventListener('submit', function (e){
        e.preventDefault()
        var gudangTujuan = document.getElementById('gudangTujuan').value
        var kotakSelected = []

        for(var i=0; i<document.getElementById('dataKotak').options.length; i++){
          if(document.getElementById('dataKotak').options[i].selected){
            kotakSelected.push(document.getElementById('dataKotak').options[i].value)
          }
        }

        document.getElementById('btnSubmit').classList.add('loading')
        document.getElementById('btnSubmit').disabled = true

        google.script.run
          .withFailureHandler((error) => {
            window.alert(error)
          })
          .withSuccessHandler((message) => {
            window.alert(message)
            document.getElementById('btnSubmit').classList.remove('loading')
            document.getElementById('btnSubmit').disabled = false
            document.getElementById('formPengembalianKotakSementara').reset()
            document.getElementById('dataKotak').textContent = ''
          })
          .saveDataPengembalianKotakAntarGudangSementara(kotakSelected, gudangTujuan)
      })
    </script>

  </body>
</html>
